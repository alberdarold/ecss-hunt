services:
  - type: web
    name: ecss-hunt-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: |
      if [ -f "main.py" ]; then
        python main.py
      elif [ -f "backend/main.py" ]; then
        cd backend && python main.py
      else
        cd backend && python production/production_working_api.py
      fi
    plan: free
    environmentVariables:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MORPHIK_URI
        sync: false
      - key: OPENAI_API_KEY  
        sync: false
      - key: ECSS_DOCUMENTS_PATH
        value: "./ECSS Published Standards/1-Active Standards/"
      - key: DEBUG
        value: false
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project/src/backend"
    healthCheckPath: /api/health 